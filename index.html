<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2F6F4E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>华东交通大学课程表</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <style>
    :root {
      --primary: #2F6F4E;
      --primary-light: #6B8E7A;
      --primary-lighter: #A8C5B0;
      --bg: #FFFFFF;
      --divider: #ECECEC;
      --text-secondary: #8C8C8C;
      --text-primary: #1A1A1A;
      --gray-dark: #4A4A4A;
      --gray-mid: #8C8C8C;
      --gray-light: #C7C7C7;
      --red-line: #E53935;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    /* ── 顶部导航栏 56px ── */
    .navbar {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      padding-top: env(safe-area-inset-top);
      border-bottom: 1px solid var(--divider);
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 30;
      gap: 12px;
    }
    .navbar-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .week-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--primary);
      color: white;
      padding: 5px 12px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .week-chip .chip-today {
      display: inline-block;
      background: rgba(255,255,255,0.25);
      padding: 0 5px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: 500;
      margin-left: 2px;
    }
    .week-chip-arrow {
      font-size: 10px;
      opacity: 0.7;
    }
    .navbar-center {
      flex: 1;
      text-align: center;
      font-size: 13px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .navbar-right {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }
    .nav-icon {
      width: 36px;
      height: 36px;
      border: none;
      background: none;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-secondary);
      border-radius: 4px;
    }
    .nav-icon:active { background: var(--divider); }

    .week-dropdown {
      display: none;
      position: absolute;
      top: 56px;
      left: 16px;
      background: var(--bg);
      border: 1px solid var(--divider);
      border-radius: 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      z-index: 40;
      max-height: 280px;
      overflow-y: auto;
      min-width: 140px;
    }
    .week-dropdown.show { display: block; }
    .week-dropdown-item {
      padding: 10px 16px;
      font-size: 13px;
      cursor: pointer;
      border-bottom: 1px solid var(--divider);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .week-dropdown-item:last-child { border-bottom: none; }
    .week-dropdown-item:active { background: var(--divider); }
    .week-dropdown-item.active { color: var(--primary); font-weight: 600; }
    .week-dropdown-item .dw-tag {
      font-size: 10px;
      background: var(--primary);
      color: white;
      padding: 1px 6px;
      border-radius: 3px;
    }

    /* ── 星期表头 40px ── */
    .day-headers {
      display: grid;
      grid-template-columns: 48px repeat(7, 1fr);
      height: 40px;
      border-bottom: 1px solid var(--divider);
      background: var(--bg);
      position: sticky;
      top: 56px;
      z-index: 20;
    }
    .day-header-corner {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: var(--text-secondary);
    }
    .day-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: var(--text-secondary);
      position: relative;
      padding-top: 2px;
    }
    .day-header .day-name {
      font-weight: 500;
      line-height: 1;
    }
    .day-header .day-date {
      font-size: 10px;
      color: var(--text-secondary);
      line-height: 1;
      margin-top: 1px;
    }
    .day-header.today {
      color: var(--text-primary);
      font-weight: 700;
    }
    .day-header.today::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--primary);
    }
    .day-header.today .day-date {
      color: var(--text-primary);
    }
    .day-header.weekend {
      color: var(--gray-mid);
    }
    .day-header.weekend .day-date {
      color: var(--gray-mid);
    }

    /* ── 课程网格 ── */
    .schedule-grid {
      display: grid;
      grid-template-columns: 48px repeat(7, 1fr);
      background: var(--bg);
      border-bottom: 1px solid var(--divider);
      position: relative;
    }
    .period-label {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 8px 2px;
      font-size: 10px;
      color: var(--text-secondary);
      background: #FAFAFA;
      border-right: 1px solid var(--divider);
      border-bottom: 1px solid var(--divider);
      min-height: 72px;
      line-height: 1.4;
    }
    .period-label .period-num {
      font-weight: 600;
      color: var(--gray-dark);
      font-size: 11px;
    }
    .period-label .period-time {
      font-size: 9px;
      color: var(--text-secondary);
    }
    .grid-cell {
      border-bottom: 1px solid var(--divider);
      border-right: 1px solid var(--divider);
      min-height: 72px;
      padding: 3px;
      position: relative;
      background: var(--bg);
    }
    .grid-cell:nth-child(8n) { border-right: none; }
    .grid-cell.weekend-cell {
      background: #FAFAFA;
    }
    .grid-cell.today-col {
      /* subtle highlight for today's column */
    }
    .grid-cell.current-period {
      /* right border highlight */
      box-shadow: inset 2px 0 0 var(--primary);
    }
    .grid-cell.current-period::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--primary);
    }

    /* 课程卡片 */
    .course-card {
      border-radius: 4px;
      padding: 6px 8px;
      margin-bottom: 2px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: opacity 0.1s;
    }
    .course-card:active { opacity: 0.85; }
    .course-card .cc-name {
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      line-height: 1.3;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .course-card .cc-room {
      font-size: 10px;
      color: rgba(255,255,255,0.85);
      line-height: 1.3;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .course-card .cc-teacher {
      font-size: 10px;
      color: rgba(255,255,255,0.7);
      line-height: 1.3;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* 6 种课程色 */
    .cc-0 { background: #2F6F4E; }
    .cc-1 { background: #6B8E7A; }
    .cc-2 { background: #A8C5B0; }
    .cc-2 .cc-name { color: var(--text-primary); }
    .cc-2 .cc-room { color: rgba(0,0,0,0.6); }
    .cc-2 .cc-teacher { color: rgba(0,0,0,0.45); }
    .cc-3 { background: #4A4A4A; }
    .cc-4 { background: #8C8C8C; }
    .cc-5 { background: #C7C7C7; }
    .cc-5 .cc-name { color: var(--text-primary); }
    .cc-5 .cc-room { color: rgba(0,0,0,0.6); }
    .cc-5 .cc-teacher { color: rgba(0,0,0,0.45); }

    /* 周末格子 */
    .weekend-msg {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      min-height: 72px;
      font-size: 11px;
      color: var(--text-secondary);
      background: #FAFAFA;
      border-bottom: 1px solid var(--divider);
      border-right: 1px solid var(--divider);
      grid-column: span 2;
    }
    .weekend-msg-inner {
      text-align: center;
      line-height: 1.6;
    }

    /* 空课格 */
    .empty-cell {
      min-height: 72px;
      border-bottom: 1px solid var(--divider);
      border-right: 1px solid var(--divider);
      background: var(--bg);
    }
    .empty-cell:nth-child(8n) { border-right: none; }

    /* ── 当前时间红线 ── */
    .time-indicator {
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--red-line);
      z-index: 10;
      pointer-events: none;
    }
    .time-indicator-label {
      position: absolute;
      left: -48px;
      top: -8px;
      font-size: 9px;
      color: var(--red-line);
      font-weight: 600;
      white-space: nowrap;
      background: var(--bg);
      padding: 1px 3px;
    }

    /* ── 底部状态栏 64px ── */
    .bottom-bar {
      height: 64px;
      padding: 0 16px;
      padding-bottom: env(safe-area-inset-bottom);
      background: #F5F5F5;
      border-top: 1px solid var(--divider);
      display: flex;
      align-items: center;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 20;
      cursor: pointer;
      gap: 10px;
    }
    .bottom-bar:active { background: #EEEEEE; }
    .bottom-bar-label {
      font-size: 11px;
      color: var(--text-secondary);
      flex-shrink: 0;
    }
    .bottom-bar-info {
      font-size: 13px;
      color: var(--primary);
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── 底部 Sheet ── */
    .sheet-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.3);
      z-index: 50;
    }
    .sheet-overlay.show { display: block; }
    .sheet-panel {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--bg);
      border-radius: 12px 12px 0 0;
      z-index: 51;
      padding: 20px 16px 32px;
      padding-bottom: calc(32px + env(safe-area-inset-bottom));
      transform: translateY(100%);
      transition: transform 0.25s ease;
      max-height: 50vh;
      overflow-y: auto;
    }
    .sheet-panel.show { transform: translateY(0); }
    .sheet-handle {
      width: 36px;
      height: 4px;
      background: var(--divider);
      border-radius: 2px;
      margin: 0 auto 16px;
    }
    .sheet-course-name {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 12px;
      line-height: 1.3;
    }
    .sheet-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
      font-size: 14px;
      color: var(--text-primary);
      border-bottom: 1px solid var(--divider);
    }
    .sheet-row:last-child { border-bottom: none; }
    .sheet-row-label {
      color: var(--text-secondary);
      font-size: 13px;
      width: 56px;
      flex-shrink: 0;
    }

    /* ── 空课状态 ── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      color: var(--text-secondary);
      font-size: 14px;
      text-align: center;
      line-height: 1.8;
    }

    /* ── 响应式：桌面端 ── */
    @media (min-width: 768px) {
      .schedule-grid {
        max-width: 960px;
        margin: 0 auto;
        border-left: 1px solid var(--divider);
        border-right: 1px solid var(--divider);
      }
      .day-headers {
        max-width: 960px;
        margin: 0 auto;
        border-left: 1px solid var(--divider);
        border-right: 1px solid var(--divider);
      }
      .grid-cell, .period-label, .empty-cell {
        min-height: 80px;
      }
      .course-card {
        padding: 8px 10px;
      }
      .course-card .cc-name { font-size: 13px; }
      .course-card .cc-room { font-size: 11px; }
      .course-card .cc-teacher { font-size: 11px; }
      .navbar { padding: 0 24px; }
      .bottom-bar { padding: 0 24px; }
      .sheet-panel {
        max-width: 480px;
        left: 50%;
        transform: translate(-50%, 100%);
      }
      .sheet-panel.show { transform: translate(-50%, 0); }
    }

    @media (min-width: 1024px) {
      .schedule-grid, .day-headers {
        max-width: 1100px;
      }
      .grid-cell, .period-label, .empty-cell {
        min-height: 90px;
      }
      .grid-cell { padding: 4px; }
      .course-card { padding: 8px 12px; }
      .course-card .cc-name { font-size: 14px; }
      .course-card .cc-room { font-size: 12px; }
      .course-card .cc-teacher { font-size: 12px; }
    }

    /* ── 加载状态 ── */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      color: var(--text-secondary);
      font-size: 13px;
    }
  </style>
</head>

  <!-- 顶部导航栏 -->

var dataSource = 'fallback';
var currentWeek = 1;

// ── 工具函数 ──
function getNowWeek() {
  var now = new Date();
  var diff = Math.floor((now - SEMESTER_START) / (7*24*60*60*1000)) + 1;
  return Math.max(1, Math.min(TOTAL_WEEKS, diff));
}

function getWeekDates(weekNum) {
  var mon = new Date(SEMESTER_START);
  mon.setDate(mon.getDate() + (weekNum-1)*7);
  var dates = [];
  for (var i = 0; i < 7; i++) {
    var d = new Date(mon);
    d.setDate(d.getDate() + i);
    dates.push(d);
  }
  return dates;
}

function formatMD(d) { return (d.getMonth()+1)+'/'+d.getDate(); }
function formatFull(d) { return (d.getMonth()+1)+'月'+d.getDate()+'日'; }
function isoDate(d) {
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function isSameDay(a,b) {
  return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
}

// ── 解析教务 HTML ──
function parseHtmlCourses(html) {
  var results = [];
  var dayNames = ['周一','周二','周三','周四','周五'];
  for (var day = 1; day <= 5; day++) {
    var dn = dayNames[day-1];
    var re = new RegExp(dn + '[\\s\\S]*?(?=(?:周[一二三四五]|</body>|$))', 'g');
    var match = html.match(re);
    if (!match) continue;
    var block = match[0];
    var liRe = /<li[^>]*>([\s\S]*?)<\/li>/g;
    var m;
    while ((m = liRe.exec(block)) !== null) {
      var li = m[1];
      var nm = li.match(/课程名称：([^<]+)/);
      if (!nm) continue;
      var name = nm[1].trim();
      var sec = li.match(/节次：([^<]+)/);
      var wk = li.match(/周次：([^<]+)/);
      var loc = li.match(/地点：([^<\s]+(?:\s[^<]+)?)/);
      var tch = li.match(/教师：([^<]+)/);
      var p = PERIODS.find(function(x){return x.label===sec&&sec[1];});
      results.push({
        name: name, day: day,
        startWeek: parseInt((wk&&wk[1]||'1-1').split('-')[0])||1,
        endWeek: parseInt((wk&&wk[1]||'1-1').split('-')[1])||1,
        sections: (sec&&sec[1]||'1-2').split('-').map(function(s){return parseInt(s)}),
        period: sec&&sec[1]||'1-2',
        time: p?p.time:'',
        location: (loc&&loc[1]||'').trim(),
        teacher: (tch&&tch[1]||'').trim()
      });
    }
  }
  return results;
}

// ── 拉取教务数据 ──
async function fetchWeekData(weekNum) {
  var dates = getWeekDates(weekNum);
  var all = [], ok = 0;
  for (var i = 0; i < dates.length; i++) {
    var d = dates[i];
    if (d.getDay()===0 || d.getDay()===6) continue;
    try {
      var url = API_BASE+'?weiXinID='+WEI_XIN_ID+'&date='+isoDate(d);
      var r = await fetch(url, {mode:'cors'});
      if (r.ok) {
        var html = await r.text();
        if (html.indexOf('imgs/today_schedule')===-1) {
          all = all.concat(parseHtmlCourses(html));
          ok++;
        }
      }
    } catch(e) {}
  }
  return {courses:all, ok:ok, total:5};
}

// ── 课程颜色 ──
function getColorIndex(name) {
  return COURSE_COLORS[name] !== undefined ? COURSE_COLORS[name] : 5;
}

// ── 渲染 ──
function renderAll() {
  renderWeekDropdown();
  renderDateRange();
  renderDayHeaders();
  renderScheduleGrid();
  updateBottomBar();

}

function renderWeekDropdown() {
  var now = getNowWeek();
  var chip = document.getElementById('weekChipText');
  var isNow = currentWeek === now;
  chip.innerHTML = '第 ' + currentWeek + ' 周' + (isNow ? ' <span class="chip-today">今</span>' : '');

  var dd = document.getElementById('weekDropdown');
  var html = '';
  for (var w = 1; w <= TOTAL_WEEKS; w++) {
    if (w === 9) continue;
    var cls = (w === currentWeek) ? 'week-dropdown-item active' : 'week-dropdown-item';
    var tag = (w === now) ? ' <span class="dw-tag">今</span>' : '';
    html += '<div class="'+cls+'" onclick="selectWeek('+w+')">第 '+w+' 周'+tag+'</div>';
  }
  dd.innerHTML = html;
}

function renderDateRange() {
  var dates = getWeekDates(currentWeek);
  var el = document.getElementById('dateRange');
  el.textContent = formatFull(dates[0]) + ' - ' + formatFull(dates[6]);
}

function renderDayHeaders() {
  var dates = getWeekDates(currentWeek);
  var today = new Date();
  var html = '<div class="day-header-corner"></div>';
  for (var d = 0; d < 7; d++) {
    var dt = dates[d];
    var dn = DAY_NAMES[dt.getDay()];
    var isToday = isSameDay(dt, today);
    var isWeekend = (dt.getDay()===0 || dt.getDay()===6);
    var cls = 'day-header';
    if (isToday) cls += ' today';
    if (isWeekend) cls += ' weekend';
    html += '<div class="'+cls+'">';
    html += '<span class="day-name">'+dn+'</span>';
    html += '<span class="day-date">'+formatMD(dt)+'</span>';
    html += '</div>';
  }
  document.getElementById('dayHeaders').innerHTML = html;
}

function renderScheduleGrid() {
  var dates = getWeekDates(currentWeek);
  var today = new Date();
  var weekCourses = courseData.filter(function(c) {
    return currentWeek >= c.startWeek && currentWeek <= c.endWeek;
  });

  var nowMinutes = today.getHours()*60 + today.getMinutes();
  var currentPeriodIdx = -1;
  for (var p = 0; p < PERIODS.length; p++) {
    if (nowMinutes >= PERIODS[p].startMin && nowMinutes <= PERIODS[p].endMin) {
      currentPeriodIdx = p;
      break;
    }
  }

  var html = '';
  for (var p = 0; p < PERIODS.length; p++) {
    var period = PERIODS[p];
    html += '<div class="period-label">';
    html += '<span class="period-num">'+period.label+'</span>';
    html += '<span class="period-time">'+period.time+'</span>';
    html += '</div>';

    for (var d = 0; d < 7; d++) {
      var dt = dates[d];
      var day = d + 1;
      var isToday = isSameDay(dt, today);
      var isWeekend = (dt.getDay()===0 || dt.getDay()===6);

      if (isWeekend) {
        // Only show weekend message once per day column
        if (p === 0) {
          html += '<div class="weekend-msg" style="grid-row: span '+PERIODS.length+'">';
          html += '<div class="weekend-msg-inner">周末</div>';
          html += '</div>';
        }
        continue;
      }

      var cellCourses = weekCourses.filter(function(c) {
        if (c.day !== day) return false;
        var pStart = p*2 + 1;
        var pEnd = p*2 + 2;
        return c.sections[0] <= pEnd && c.sections[c.sections.length-1] >= pStart;
      });

      var cls = 'grid-cell';
      if (isToday) cls += ' today-col';
      if (isToday && p === currentPeriodIdx) cls += ' current-period';

      html += '<div class="'+cls+'">';
      for (var ci = 0; ci < cellCourses.length; ci++) {
        var c = cellCourses[ci];
        var ci2 = getColorIndex(c.name);
        html += '<div class="course-card cc-'+ci2+'" onclick="openSheet(event, \''+
          c.name.replace(/'/g,"\\'")+'\', \''+
          (c.teacher||'').replace(/'/g,"\\'")+'\', \''+
          (c.location||'').replace(/'/g,"\\'")+'\', \''+
          c.period+'\', \''+
          (c.time||'').replace(/'/g,"\\'")+'\', '+
          c.startWeek+', '+c.endWeek+')">';
        html += '<div class="cc-name">'+c.name+'</div>';
        html += '<div class="cc-room">'+(c.location||'')+'</div>';
        html += '<div class="cc-teacher">'+(c.teacher||'')+'</div>';
        html += '</div>';
      }
      html += '</div>';
    }

    // Lunch break after 3-4节
    if (p === 1) {
      html += '<div class="period-label" style="min-height:20px;font-size:9px;color:var(--text-secondary);border-bottom:1px dashed var(--divider)">';
      html += '午休';
      html += '</div>';
      for (var d2 = 0; d2 < 7; d2++) {
        var dt2 = dates[d2];
        var isWE2 = (dt2.getDay()===0 || dt2.getDay()===6);
        if (isWE2) continue;
        html += '<div class="empty-cell" style="min-height:20px;border-bottom:1px dashed var(--divider)"></div>';
      }
    }
  }

  document.getElementById('scheduleGrid').innerHTML = html;
}

// ── 底部栏 ──
function updateBottomBar() {
  var dates = getWeekDates(currentWeek);
  var today = new Date();
  var weekCourses = courseData.filter(function(c) {
    return currentWeek >= c.startWeek && currentWeek <= c.endWeek;
  });
  var nowMinutes = today.getHours()*60 + today.getMinutes();

  // Find next class
  var nextClass = null;
  var allCourses = [];
  for (var i = 0; i < weekCourses.length; i++) {
    var c = weekCourses[i];
    allCourses.push({
      course: c,
      dayDate: dates[c.day-1],
      startMin: PERIODS[Math.floor((c.sections[0]-1)/2)].startMin
    });
  }
  allCourses.sort(function(a,b) {
    if (a.dayDate - b.dayDate !== 0) return a.dayDate - b.dayDate;
    return a.startMin - b.startMin;
  });

  for (var i = 0; i < allCourses.length; i++) {
    var a = allCourses[i];
    var courseTime = new Date(a.dayDate);
    courseTime.setHours(Math.floor(a.startMin/60), a.startMin%60, 0, 0);
    if (courseTime > today) {
      nextClass = a;
      break;
    }
  }

  var info = document.getElementById('bottomBarInfo');
  if (nextClass) {
    var dayName = DAY_NAMES[nextClass.dayDate.getDay()];
    info.textContent = dayName+' '+formatFull(nextClass.dayDate)+' · '+nextClass.course.name+' · '+nextClass.course.location+' · '+nextClass.course.period+'节';
  } else {
    info.textContent = '本学期课程已结束';
  }
}

// ── 当前时间红线 ──
function scheduleTimeIndicator() {
  // Remove existing
  var old = document.getElementById('timeIndicator');
  if (old) old.remove();

  var today = new Date();
  var dates = getWeekDates(currentWeek);
  var todayCol = -1;
  for (var d = 0; d < 7; d++) {
    if (isSameDay(dates[d], today)) { todayCol = d; break; }
  }
  if (todayCol < 0) return;

  var nowMinutes = today.getHours()*60 + today.getMinutes();
  var totalPeriodStart = PERIODS[0].startMin;
  var totalPeriodEnd = PERIODS[PERIODS.length-1].endMin;
  if (nowMinutes < totalPeriodStart || nowMinutes > totalPeriodEnd) return;

  // Calculate position
  var gridEl = document.getElementById('scheduleGrid');
  var gridRect = gridEl.getBoundingClientRect();
  var cells = gridEl.querySelectorAll('.grid-cell, .period-label, .empty-cell, .weekend-msg');
  // Find the today column cells
  // We need to find the position in the grid
  // Actually, let's use a simpler approach: find the position based on periods

  var totalRange = totalPeriodEnd - totalPeriodStart;
  var elapsed = nowMinutes - totalPeriodStart;
  var ratio = elapsed / totalRange;

  // Count rows: 4 periods + lunch break row = 5 rows
  var rowCount = 5;
  // Each period row is roughly equal height
  var lunchRatio = 0.04; // lunch break is ~4% of total height
  var periodRatio = (1 - lunchRatio) / 4;

  var topPct = 0;
  var periodIdx = -1;
  for (var p = 0; p < PERIODS.length; p++) {
    if (nowMinutes >= PERIODS[p].startMin && nowMinutes <= PERIODS[p].endMin) {
      periodIdx = p;
      var inPeriodRatio = (nowMinutes - PERIODS[p].startMin) / (PERIODS[p].endMin - PERIODS[p].startMin);
      topPct = (p * periodRatio + inPeriodRatio * periodRatio) * 100;
      break;
    }
  }

  if (periodIdx < 0) {
    // Between periods
    for (var p = 0; p < PERIODS.length-1; p++) {
      if (nowMinutes > PERIODS[p].endMin && nowMinutes < PERIODS[p+1].startMin) {
        topPct = ((p+1) * periodRatio) * 100;
        break;
      }
    }
  }

  if (topPct === 0 && nowMinutes < PERIODS[0].startMin) topPct = 0;
  if (nowMinutes > PERIODS[PERIODS.length-1].endMin) topPct = 100;

  var indicator = document.createElement('div');
  indicator.id = 'timeIndicator';
  indicator.className = 'time-indicator';
  indicator.style.top = topPct + '%';

  var label = document.createElement('span');
  label.className = 'time-indicator-label';
  label.textContent = '现在 '+String(today.getHours()).padStart(2,'0')+':'+String(today.getMinutes()).padStart(2,'0');
  indicator.appendChild(label);

  document.getElementById('scheduleGridWrapper').appendChild(indicator);
}

  currentWeek = w;
  document.getElementById('weekDropdown').classList.remove('show');

}

function openSheet(e, name, teacher, location, period, time, startWeek, endWeek) {
  e.stopPropagation();
  var content = document.getElementById('sheetContent');
  var weekRange = startWeek === endWeek ? '第'+startWeek+'周' : '第'+startWeek+'-'+endWeek+'周';
  content.innerHTML =
    '<div class="sheet-course-name">'+name+'</div>'+
    '<div class="sheet-row"><span class="sheet-row-label">教师</span>'+teacher+'</div>'+
    '<div class="sheet-row"><span class="sheet-row-label">教室</span>'+location+'</div>'+
    '<div class="sheet-row"><span class="sheet-row-label">节次</span>'+period+'节 '+time+'</div>'+
    '<div class="sheet-row"><span class="sheet-row-label">周次</span>'+weekRange+'</div>';
  document.getElementById('sheetOverlay').classList.add('show');
  document.getElementById('sheetPanel').classList.add('show');
}

function closeSheet() {
  document.getElementById('sheetOverlay').classList.remove('show');
  document.getElementById('sheetPanel').classList.remove('show');
}

function scrollToNextClass() {
  // Scroll to next class - simple: scroll to today's column
  var today = new Date();
  var dates = getWeekDates(currentWeek);
  for (var d = 0; d < 7; d++) {
    if (isSameDay(dates[d], today)) {
      var cells = document.querySelectorAll('.grid-cell.today-col');
      if (cells.length > 0) {
        cells[0].scrollIntoView({behavior:'smooth',block:'center'});
      }
      break;
    }
  }
}

// ── 滑动手势 ──
var touchStartX = 0;
var touchStartY = 0;
document.addEventListener('touchstart', function(e) {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, {passive:true});

document.addEventListener('touchend', function(e) {
  var dx = e.changedTouches[0].clientX - touchStartX;
  var dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 60) {
    if (dx > 0 && currentWeek > 1) {
      // Swipe right: previous week
      currentWeek--;
      if (currentWeek === 8) currentWeek = 7;
    } else if (dx < 0 && currentWeek < TOTAL_WEEKS) {
      // Swipe left: next week
      currentWeek++;
      if (currentWeek === 9) currentWeek = 10;
    }
    renderAll();
  }
}, {passive:true});

// ── 点击外部关闭下拉 ──
document.addEventListener('click', function(e) {
  var dd = document.getElementById('weekDropdown');
  var chip = document.getElementById('weekChip');
  if (!dd.contains(e.target) && !chip.contains(e.target)) {
    dd.classList.remove('show');
  }
});

// ── 刷新 ──
function refreshData() {
  loadWeek(currentWeek);
}

// ── 主加载 ──
async function loadWeek(weekNum) {
  var live = await fetchWeekData(weekNum);
  if (live.courses.length > 0) {
    courseData = live.courses;
    dataSource = 'live';
  }
  renderAll();
}

// ── 初始化 ──

loadWeek(currentWeek);

// 每分钟更新当前时间红线
setInterval(function() {
  scheduleTimeIndicator();
