<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1a73e8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>华东交通大学课程表</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <style>
    :root {
      --bg: #f0f2f5;
      --card: #ffffff;
      --text: #1d1d1f;
      --sub: #86868b;
      --accent: #1a73e8;
      --border: #e5e5ea;
      --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --radius: 14px;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: var(--font);
      background: var(--bg);
      min-height: 100vh;
      min-height: 100dvh;
      color: var(--text);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── 顶部栏 ── */
    .topbar {
      background: var(--card);
      padding: 12px 16px;
      padding-top: max(12px, env(safe-area-inset-top));
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .topbar-brand {
      display: flex;
      flex-direction: column;
    }
    .topbar-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.3px;
    }
    .topbar-sub {
      font-size: 11px;
      color: var(--sub);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .topbar-sub .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #34c759;
      display: inline-block;
    }
    .topbar-sub .dot.off { background: #ff3b30; }
    .topbar-actions {
      display: flex;
      gap: 8px;
    }
    .icon-btn {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: none;
      background: #f5f5f7;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #555;
      transition: background 0.15s;
    }
    .icon-btn:active { background: #e5e5ea; }

    /* ── 周切换 ── */
    .week-bar {
      display: flex;
      align-items: center;
      padding: 12px 16px 8px;
      gap: 6px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .week-bar::-webkit-scrollbar { display: none; }
    .week-chip {
      flex-shrink: 0;
      padding: 7px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--card);
      font-size: 13px;
      color: var(--text);
      cursor: pointer;
      font-weight: 500;
      white-space: nowrap;
      transition: all 0.2s;
      box-shadow: var(--shadow);
    }
    .week-chip.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
      font-weight: 600;
    }
    .week-chip.today {
      border-color: var(--accent);
      color: var(--accent);
    }
    .week-chip.today.active {
      background: var(--accent);
      color: white;
    }

    /* ── 课表：桌面端网格 ── */
    .schedule-wrap {
      padding: 0 12px 16px;
    }
    .schedule-grid {
      display: none;
    }
    .schedule-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* 日卡片 */
    .day-card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .day-card-header {
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .day-card-header .day-date {
      font-size: 12px;
      font-weight: 400;
      color: var(--sub);
    }
    .day-card-header.today {
      background: var(--accent);
      color: #fff;
      border-bottom-color: var(--accent);
    }
    .day-card-header.today .day-date { color: rgba(255,255,255,0.8); }
    .day-card-body {
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 40px;
    }
    .day-empty {
      padding: 16px;
      text-align: center;
      color: #bbb;
      font-size: 13px;
    }

    .course-block {
      background: #e8f0fe;
      border-radius: 8px;
      padding: 10px 12px;
      cursor: default;
      transition: transform 0.15s;
      border-left: 4px solid transparent;
      position: relative;
    }
    .course-block:active { transform: scale(0.98); }
    .course-block .c-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.4;
    }
    .course-block .c-meta {
      font-size: 12px;
      color: #666;
      margin-top: 3px;
      line-height: 1.4;
    }
    .course-block .c-loc {
      font-size: 11px;
      color: #888;
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* ── 桌面端：≥640px 显示网格 ── */
    @media (min-width: 640px) {
      .schedule-list { display: none; }
      .schedule-grid {
        display: grid;
        grid-template-columns: 52px repeat(5, 1fr);
        border-radius: var(--radius);
        background: var(--card);
        box-shadow: var(--shadow);
        overflow: hidden;
      }
      .schedule-grid .col-head {
        padding: 10px 4px;
        text-align: center;
        font-size: 12px;
        font-weight: 600;
        color: var(--sub);
        border-bottom: 1px solid var(--border);
        background: #fafafa;
        letter-spacing: 0.5px;
      }
      .schedule-grid .col-head:first-child {
        color: transparent;
      }
      .schedule-grid .row-label {
        padding: 8px 4px;
        text-align: center;
        font-size: 11px;
        color: var(--sub);
        border-right: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 1px;
        line-height: 1.2;
      }
      .schedule-grid .row-label .period {
        font-weight: 600;
        color: #555;
        font-size: 12px;
      }
      .schedule-grid .cell {
        border-bottom: 1px solid #f0f0f5;
        border-right: 1px solid #f0f0f5;
        padding: 4px;
        min-height: 62px;
        position: relative;
      }
      .schedule-grid .cell:nth-child(6n) { border-right: none; }
      .course-block {
        padding: 6px 8px;
        border-radius: 6px;
        border-left-width: 3px;
      }
      .course-block .c-name { font-size: 13px; }
      .course-block .c-meta { font-size: 10px; }
      .course-block .c-loc { font-size: 10px; }
    }

    /* ── 课程颜色 ── */
    .c-操作系统      { background: #e8f5e9; border-left-color: #4caf50; }
    .c-算法设计与分析 { background: #fce4ec; border-left-color: #e91e63; }
    .c-软件项目管理   { background: #e3f2fd; border-left-color: #2196f3; }
    .c-前端框架技术   { background: #fff3e0; border-left-color: #ff9800; }
    .c-大数据技术基础 { background: #f3e5f5; border-left-color: #9c27b0; }
    .c-形势与政策     { background: #fffde7; border-left-color: #fbc02d; }
    .c-JAVA           { background: #e0f7fa; border-left-color: #00bcd4; }
    .c-面向对象分析与设计 { background: #fbe9e7; border-left-color: #ff5722; }
    .c-人工智能基础   { background: #e8eaf6; border-left-color: #3f51b5; }
    .c-数据库应用技术 { background: #e0f2f1; border-left-color: #009688; }

    .c-name-os { color: #2e7d32; }
    .c-name-algo { color: #c62828; }
    .c-name-pm { color: #1565c0; }
    .c-name-fe { color: #e65100; }
    .c-name-bd { color: #6a1b9a; }
    .c-name-policy { color: #f57f17; }
    .c-name-java { color: #00838f; }
    .c-name-oo { color: #bf360c; }
    .c-name-ai { color: #283593; }
    .c-name-db { color: #00695c; }

    /* ── 底部提示 ── */
    .notice-bar {
      padding: 0 16px 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--sub);
      justify-content: center;
    }
    .notice-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #34c759;
    }
    .notice-dot.syncing { background: #ff9500; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    /* ── 加载空态 ── */
    .skeleton {
      animation: shimmer 1.5s infinite;
      background: linear-gradient(90deg, #f0f0f5 25%, #e5e5ea 50%, #f0f0f5 75%);
      background-size: 200% 100%;
      border-radius: 6px;
    }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    </style>
</head>

<script>
if ('serviceWorker' in navigator) {

// ── 常量 ──
var WEI_XIN_ID = 'orOcuwb607tk0FdFfu2GXHTDcNw8';

var SEMESTER_START = new Date('2026-08-31');

var PERIODS = [

  '人工智能基础': 'ai', '数据库应用技术': 'db'
};

var courseData = [{"name": "操作系统", "day": 1, "startWeek": 1, "endWeek": 8, "sections": [1, 2], "period": "1-2", "time": "08:00-09:40", "location": "31-530", "teacher": "叶云青"}, {"name": "算法设计与分析", "day": 1, "startWeek": 1, "endWeek": 8, "sections": [5, 6], "period": "5-6", "time": "14:00-15:40", "location": "31-215", "teacher": "邓志刚"}, {"name": "操作系统", "day": 2, "startWeek": 1, "endWeek": 8, "sections": [1, 2], "period": "1-2", "time": "08:00-09:40", "location": "31-530", "teacher": "叶云青"}, {"name": "软件项目管理", "day": 2, "startWeek": 1, "endWeek": 8, "sections": [5, 6], "period": "5-6", "time": "14:00-15:40", "location": "31-522", "teacher": "丁琼"}, {"name": "前端框架技术", "day": 2, "startWeek": 1, "endWeek": 8, "sections": [7, 8], "period": "7-8", "time": "16:10-17:50", "location": "31-220", "teacher": "万畅"}, {"name": "前端框架技术", "day": 3, "startWeek": 1, "endWeek": 8, "sections": [1, 2], "period": "1-2", "time": "08:00-09:40", "location": "31-204", "teacher": "万畅"}, {"name": "软件项目管理", "day": 3, "startWeek": 1, "endWeek": 8, "sections": [3, 4], "period": "3-4", "time": "10:10-11:50", "location": "31-522", "teacher": "丁琼"}, {"name": "大数据技术基础(B)", "day": 3, "startWeek": 1, "endWeek": 8, "sections": [7, 8], "period": "7-8", "time": "16:10-17:50", "location": "31-519", "teacher": "王辉"}, {"name": "操作系统", "day": 4, "startWeek": 1, "endWeek": 8, "sections": [3, 4], "period": "3-4", "time": "10:10-11:50", "location": "31-530", "teacher": "叶云青"}, {"name": "软件项目管理", "day": 5, "startWeek": 1, "endWeek": 8, "sections": [1, 2], "period": "1-2", "time": "08:00-09:40", "location": "31-522", "teacher": "丁琼"}, {"name": "算法设计与分析", "day": 5, "startWeek": 1, "endWeek": 8, "sections": [3, 4], "period": "3-4", "time": "10:10-11:50", "location": "南图301", "teacher": "邓志刚"}, {"name": "大数据技术基础(B)", "day": 5, "startWeek": 1, "endWeek": 8, "sections": [7, 8], "period": "7-8", "time": "16:10-17:50", "location": "31-519", "teacher": "王辉"}, {"name": "形势与政策Ⅴ", "day": 4, "startWeek": 5, "endWeek": 8, "sections": [5, 6], "period": "5-6", "time": "14:00-15:40", "location": "31-219", "teacher": "肖泽伟"}, {"name": "JAVA Web框架技术", "day": 1, "startWeek": 10, "endWeek": 17, "sections": [1, 2], "period": "1-2", "time": "08:00-09:40", "location": "31-528", "teacher": "汪斌"}, {"name": "面向对象分析与设计", "day": 1, "startWeek": 10, "endWeek": 17, "sections": [3, 4], "period": "3-4", "time": "10:10-11:50", "location": "31-205", "teacher": "企业教师6"}, {"name": "人工智能基础", "day": 2, "startWeek": 10, "endWeek": 17, "sections": [1, 2], "period": "1-2", "time": "08:00-09:40", "location": "31-409", "teacher": "邬昌兴"}, {"name": "数据库应用技术", "day": 2, "startWeek": 10, "endWeek": 17, "sections": [3, 4], "period": "3-4", "time": "10:10-11:50", "location": "31-205", "teacher": "企业教师1"}, {"name": "面向对象分析与设计", "day": 4, "startWeek": 10, "endWeek": 17, "sections": [1, 2], "period": "1-2", "time": "08:00-09:40", "location": "31-205", "teacher": "企业教师6"}, {"name": "JAVA Web框架技术", "day": 4, "startWeek": 10, "endWeek": 17, "sections": [3, 4], "period": "3-4", "time": "10:10-11:50", "location": "31-528", "teacher": "汪斌"}, {"name": "人工智能基础", "day": 5, "startWeek": 10, "endWeek": 17, "sections": [3, 4], "period": "3-4", "time": "10:10-11:50", "location": "31-409", "teacher": "邬昌兴"}, {"name": "数据库应用技术", "day": 5, "startWeek": 10, "endWeek": 17, "sections": [5, 6], "period": "5-6", "time": "14:00-15:40", "location": "31-216", "teacher": "企业教师1"}];
var dataSource = 'fallback';
var currentWeek = 1;

// ── 周次计算 ──
function getNowWeek() {
  var now = new Date();
  var diff = Math.floor((now - SEMESTER_START) / (7 * 24 * 60 * 60 * 1000)) + 1;
  return Math.max(1, Math.min(TOTAL_WEEKS, diff));
}

function getWeekDates(weekNum) {
  var mon = new Date(SEMESTER_START);
  mon.setDate(mon.getDate() + (weekNum - 1) * 7);
  var dates = [];
  for (var i = 0; i < 7; i++) {
    var d = new Date(mon);
    d.setDate(d.getDate() + i);
    dates.push(d);
  }
  return dates;
}

function formatDate(d) {
  return (d.getMonth()+1) + '月' + d.getDate() + '日';
}

function isoDate(d) {
  var y = d.getFullYear();
  var m = String(d.getMonth()+1).padStart(2,'0');
  var day = String(d.getDate()).padStart(2,'0');
  return y + '-' + m + '-' + day;
}

// ── 解析教务 HTML ──
function parseHtmlCourses(html) {
  var results = [];
  var dayNames = ['周一','周二','周三','周四','周五'];
  for (var day = 1; day <= 5; day++) {
    var dn = dayNames[day-1];
    var re = new RegExp(dn + '[\\s\\S]*?(?=(?:周[一二三四五]|</body>|$))', 'g');
    var match = html.match(re);
    if (!match) continue;
    var block = match[0];
    var liRe = /<li[^>]*>([\s\S]*?)<\/li>/g;
    var m;
    while ((m = liRe.exec(block)) !== null) {
      var li = m[1];
      var nm = li.match(/课程名称：([^<]+)/);
      if (!nm) continue;
      var name = nm[1].trim();
      var sec = li.match(/节次：([^<]+)/);
      var wk = li.match(/周次：([^<]+)/);
      var loc = li.match(/地点：([^<\s]+(?:\s[^<]+)?)/);
      var tch = li.match(/教师：([^<]+)/);
      results.push({
        name: name,
        day: day,
        startWeek: parseInt((wk&&wk[1]||'1-1').split('-')[0]) || 1,
        endWeek: parseInt((wk&&wk[1]||'1-1').split('-')[1]) || 1,
        sections: (sec&&sec[1]||'1-2').split('-').map(function(s){return parseInt(s)}),
        period: sec&&sec[1]||'1-2',
        time: PERIODS.find(function(p){return p.label===sec&&sec[1]}) ? PERIODS.find(function(p){return p.label===sec&&sec[1]}).time : '',
        location: (loc&&loc[1]||'').trim(),
        teacher: (tch&&tch[1]||'').trim()
      });
    }
  }
  return results;
}

// ── 拉取教务数据 ──
async function fetchWeekData(weekNum) {
  var dates = getWeekDates(weekNum);
  var all = [];
  var ok = 0;
  for (var i = 0; i < dates.length; i++) {
    var d = dates[i];
    if (d.getDay() === 0 || d.getDay() === 6) continue;
    try {
      var url = API_BASE + '?weiXinID=' + WEI_XIN_ID + '&date=' + isoDate(d);
      var r = await fetch(url, {mode:'cors'});
      if (r.ok) {
        var html = await r.text();
        if (html.indexOf('imgs/today_schedule') === -1) {
          all = all.concat(parseHtmlCourses(html));
          ok++;
        }
      }
    } catch(e) {}
  }
  return {courses:all, ok:ok, total:5};
}

// ── 渲染 ──
function renderAll() {
  renderWeekBar();
  renderSchedule();
}

function getCourseClass(name) {
  var key = COURSE_COLORS[name] || '';
  return key ? 'c-' + key : '';
}

function renderWeekBar() {
  var bar = document.getElementById('weekBar');
  var now = getNowWeek();
  var html = '';
  for (var w = 1; w <= TOTAL_WEEKS; w++) {
    if (w === 9) { html += '<span style="flex-shrink:0;width:8px"></span>'; continue; }
    var cls = 'week-chip';
    if (w === currentWeek) cls += ' active';
    if (w === now) cls += ' today';
    html += '<button class="' + cls + '" data-week="' + w + '">第' + w + '周</button>';
  }
  bar.innerHTML = html;

  var chips = bar.querySelectorAll('.week-chip');
  for (var i = 0; i < chips.length; i++) {
    chips[i].onclick = function() {
      currentWeek = parseInt(this.dataset.week);
      renderAll();
      return false;
    };
  }
}

function renderCourseBlock(c) {
  var cls = getCourseClass(c.name);
  return '<div class="course-block ' + cls + '">' +
    '<div class="c-name">' + c.name + '</div>' +
    '<div class="c-meta">' + c.period + '节 ' + (c.time||'') + '</div>' +
    '<div class="c-loc">' + (c.location||'') + ' ' + (c.teacher||'') + '</div>' +
    '</div>';
}

function renderSchedule() {
  var dates = getWeekDates(currentWeek);
  var weekCourses = courseData.filter(function(c) {
    return currentWeek >= c.startWeek && currentWeek <= c.endWeek;
  });
  var today = new Date();

  // ── 桌面端网格 ──
  var grid = document.getElementById('scheduleGrid');
  var ghtml = '<div class="col-head"></div>';
  for (var d = 1; d <= 5; d++) {
    var dt = dates[d-1];
    var wd = DAY_NAMES[dt.getDay()];
    var isToday = (dt.getFullYear() === today.getFullYear() &&
                   dt.getMonth() === today.getMonth() &&
                   dt.getDate() === today.getDate());
    var style = isToday ? 'color:#1a73e8;font-weight:700' : '';
    ghtml += '<div class="col-head" style="' + style + '">' + wd + '<br><span style="font-size:10px;font-weight:400">' + formatDate(dt) + '</span></div>';
  }
  for (var p = 0; p < 4; p++) {
    var period = PERIODS[p];
    ghtml += '<div class="row-label"><span class="period">' + period.label + '</span>' + period.time + '</div>';
    for (var d = 1; d <= 5; d++) {
      var cellCourses = weekCourses.filter(function(c) {
        if (c.day !== d) return false;
        var pStart = p * 2 + 1;
        var pEnd = p * 2 + 2;
        return c.sections[0] <= pEnd && c.sections[c.sections.length-1] >= pStart;
      });
      ghtml += '<div class="cell">';
      for (var ci = 0; ci < cellCourses.length; ci++) {
        ghtml += renderCourseBlock(cellCourses[ci]);
      }
      ghtml += '</div>';
    }
  }
  grid.innerHTML = ghtml;

  // ── 手机端列表 ──
  var list = document.getElementById('scheduleList');
  var lhtml = '';
  for (var d = 1; d <= 5; d++) {
    var dt2 = dates[d-1];
    var wd2 = DAY_NAMES[dt2.getDay()];
    var isToday2 = (dt2.getFullYear() === today.getFullYear() &&
                    dt2.getMonth() === today.getMonth() &&
                    dt2.getDate() === today.getDate());
    var dayCourses = weekCourses.filter(function(c) { return c.day === d; });
    // 按节次排序
    dayCourses.sort(function(a,b) { return a.sections[0] - b.sections[0]; });

    lhtml += '<div class="day-card">';
    lhtml += '<div class="day-card-header' + (isToday2 ? ' today' : '') + '">';
    lhtml += '<span>' + wd2 + '</span>';
    lhtml += '<span class="day-date">' + formatDate(dt2) + '</span>';
    lhtml += '</div>';
    lhtml += '<div class="day-card-body">';
    if (dayCourses.length === 0) {
      lhtml += '<div class="day-empty">这天没有课 🎉</div>';
    } else {
      for (var ci = 0; ci < dayCourses.length; ci++) {
        lhtml += renderCourseBlock(dayCourses[ci]);
      }
    }
    lhtml += '</div></div>';
  }
  list.innerHTML = lhtml;
}
